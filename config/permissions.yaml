# What the agents may do without asking Ben. Enforced in code by libs/pipeline/src/gate.ts (P2):
# a prompt can never widen any of this. Edit by hand or with `fha perms …`.
#
# Precedence, most restrictive first: paused → tool off → kind deny/missing → locked player
# leaving → limit exceeded → ask-listed or protected player → the kind's mode.

# Nothing executes while true; every plan is logged as "would execute". Leave on for the first
# days in season, until the dry-run diffs look right (M5).
dryRun: true

# Kill switch. `fha stop` sets it, `fha resume` clears it.
paused: false

# Per plan kind: allow (execute), ask (queue for Ben's approval), deny. A missing kind is deny.
plans:
  lineup: { mode: allow }
  addDrop: { mode: allow, limits: { maxPerWeek: 3 } }
  waiverClaim: { mode: allow, limits: { maxPerWeek: 3 } }
  tradePropose: { mode: ask, limits: { minTradeGain: 0.25 } }
  tradeRespond: { mode: ask }

# Players by playerKey. Use `fha perms lock "<name>"` so names are resolved safely (P3).
players:
  # Never dropped, never traded away. Acquiring or moving them in the lineup is unaffected.
  locked: []
  # Any plan touching them needs Ben's approval, even when the kind is allow.
  ask: []

# Propose tools. false removes the tool from every agent AND denies any plan it produced.
tools:
  proposeLineup: true
  proposeAddDrop: true
  proposeWaiverClaim: true
  proposeTrade: true
  proposeTradeResponse: true

# Our top-N by rest-of-season VORP need approval before they can be dropped or traded.
protected:
  topNByVorp: 6

# Auto-grab (D-016): when a free agent comes back from injury, or another team drops a healthy
# player, and he is a substantial upgrade, act at once instead of waiting for the 08:00 waivers
# job. It goes through the same gate as everything else: the plan modes, caps, locks, protected
# and ask-listed players, pause and tool switches above all still apply.
autoGrab:
  # Off: nothing is evaluated between scheduled runs.
  enabled: true
  # Net gain needed, in VORP units over the rest of the season: the add's value minus the
  # drop's, each discounted for expected time out (the waiver scorer's units; the ordinary add
  # bar is 0.5). Using the week's last add needs twice this.
  minGain: 1.5
  # With dry run on, an auto-grab is an urgent "Grab X now?" push you complete with one tap.
  # true: execute free-agent adds even while dry run is on. Waiver claims are always yours to
  # file in Yahoo (unobserved write, U-12).
  ignoreDryRun: false
  # Optional: at most this many auto-grabs (done or proposed) per week.
  # maxPerWeek: 2
