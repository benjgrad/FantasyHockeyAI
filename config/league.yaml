# League configuration.
#
# `source: configOverride` means these settings were entered by hand, NOT read from
# Yahoo. They are Yahoo's DEFAULT NHL head-to-head categories league and are a guess
# until Q-001/Q-006 in docs/ROADMAP.md are answered. Everything downstream -- pool
# sizes, replacement levels, the entire ranking -- depends on getting these right.
#
# To correct them: open your league's Settings page and edit the two lists below.

source: configOverride
name: 'Unconfirmed League'
leagueKey: '465.l.00000'
numTeams: 12
scoringType: head

# Yahoo abbreviations. Supported set is in libs/model/src/categories.ts; an unknown
# abbreviation fails loudly rather than being silently dropped (§11.3).
categories:
  skater: [G, A, '+/-', PIM, PPP, SOG, FW]
  goalie: [W, GAA, 'SV%', SHO]

# Starting slots size the draftable pool. BN/IR/IR+/NA are not starting slots.
rosterSlots:
  - { position: C, count: 2 }
  - { position: LW, count: 2 }
  - { position: RW, count: 2 }
  - { position: D, count: 4 }
  - { position: G, count: 2 }
  - { position: BN, count: 4, isStarting: false }
  - { position: 'IR+', count: 2, isStarting: false }

# Season-long category punts: set a weight to 0 to remove a category entirely.
categoryWeights: {}
