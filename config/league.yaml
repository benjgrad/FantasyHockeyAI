# League configuration.
#
# Read from Yahoo's website API on 2026-09-24 by prototypes/yahoo-web (see its README).
# Source is `browser` rather than `yahooApi`: these are real settings from Ben's league,
# obtained through the website's own backend rather than a Yahoo developer app.
#
# League: Method Fantasy League (477.l.48535), Ben's team 477.l.48535.t.6
# Live snake draft 2026-09-24 21:00 ET, 17 rounds, 90 s per pick.
# Lineup lock: intraday, per game. Waivers: rolling 2 days, no FAAB, max 3 adds/week,
# goalie minimum 3 GP/week. Trade deadline 2027-03-03 (league vote).

source: browser
name: 'Method Fantasy League'
leagueKey: '477.l.48535'
numTeams: 8
scoringType: head

# Scored categories. Display-only categories (GA, SV, SA) are deliberately absent:
# they are shown in Yahoo but not scored, so they must not enter the valuation.
categories:
  skater: [G, A, '+/-', PIM, PPP, SHP, GWG, SOG, HIT]
  goalie: [W, GAA, 'SV%', SHO]

rosterSlots:
  - { position: C, count: 2 }
  - { position: LW, count: 2 }
  - { position: RW, count: 2 }
  - { position: D, count: 4 }
  - { position: Util, count: 1 }
  - { position: G, count: 2 }
  - { position: BN, count: 4, isStarting: false }
  - { position: IR, count: 2, isStarting: false }

# Season-long category punts: set a weight to 0 to remove a category entirely.
categoryWeights: {}
