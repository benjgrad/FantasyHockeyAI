# FantasyHockeyAI draft board.
#
# Proxies to the app on loopback:8710. The app binds to 127.0.0.1 only, so nginx is the sole
# route in and TLS is never optional. Web Push requires HTTPS, which is the other reason this
# cannot be served directly.
server {
    listen 80;
    server_name draft.gradyserver.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name draft.gradyserver.com;

    # certbot fills these in; see deploy/setup-nginx.sh
    ssl_certificate     /etc/letsencrypt/live/draft.gradyserver.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/draft.gradyserver.com/privkey.pem;

    # The board is a credential-protected view of a private league.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # A service worker may only control a scope it is served from, so it must not be rewritten.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8710/sw.js;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # The board polls every few seconds; keep it responsive and unbuffered.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
